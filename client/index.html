<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inventário</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main>
    <header><h1>Inventário</h1></header>
        <section>
            <form action="http://localhost:3000/bens" method="post">
                <input type="text" name="item" placeholder="Nome do Item" required>
                <input type="text" name="local" placeholder="Local" required>
                <input type="date" name="dataRegistro" placeholder="Data Registro" required>
                <input type="number" step="0.01" name="valor" placeholder="Valor do Item" required>
                <input type="text" name="patrimonio" placeholder="Número de patrímonio" required>
                <button type="submit">Enviar
            </form>
        </section>
    <section>
        <table border="1">
            <thead>
                <th>Item</th>
                <th>Local</th>
                <th>Data</th>
                <th>Valor</th>
                <th>Patrimonio</th>
            </thead>
            <tbody id="tabela">
                <script>
                    fetch('http://localhost:3000/bens')
                    .then(resp => resp.json())
                    .then(resp => {
                        resp.forEach(p => {
                            const linha = document.createElement('tr')
                            linha.innerHTML = `
                            <td>${p.item}</td>
                            <td>${p.local}</td>
                            <td>${p.dataRegistro}</td>
                            <td>${p.valor}</td>
                            <td>${p.patrimonio}</td>
                            `

                            tabela.appendChild(linha)
                        })
                    })
                </script>
            </tbody>
        </table>
    </section>
    <footer><h2>by matheuspaiato</h2></footer>
</main>
</body>
</html>
